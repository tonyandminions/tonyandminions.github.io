<style>
@font-face{font-family:Poppins;src:url(Poppins-Bold.ttf);font-weight:700}
:root{--bg:#0e0d12;--card:#17161d;--line:#26242f;--lime:#b8ff3b;--text:#f4f4f6;--mute:#9b98a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:48px 18px 40px}
main{width:100%;max-width:440px;text-align:center}
.logo{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 18px}
h1{font-size:26px;letter-spacing:.5px}
h1 span{color:var(--lime)}
.tag{color:var(--mute);font-size:13px;letter-spacing:2.5px;text-transform:uppercase;margin:8px 0 30px}
a.btn{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);color:var(--text);
  text-decoration:none;border-radius:16px;padding:16px 18px;margin-bottom:12px;font-weight:700;font-size:16px;
  transition:transform .12s ease,border-color .12s ease}
a.btn:hover{transform:translateY(-2px);border-color:var(--lime)}
a.btn svg{width:22px;height:22px;flex:none;fill:var(--text)}
a.btn .sub{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px}
a.btn .txt{text-align:left;flex:1}
a.btn .arrow{color:var(--lime);font-size:18px}
a.btn.main{border-color:var(--lime)}
footer{color:var(--mute);font-size:11px;margin-top:26px;letter-spacing:1px}
</style>
